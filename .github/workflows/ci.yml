name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Playwright, against a dev server this job starts itself.
  #
  # With nothing configured at all this runs 7 tests and skips 25: static
  # public pages, client-side form validation, and the listings browse UI
  # including the collapsible filter panel. Note the app itself is
  # unconfigured too -- there is no .env in a fresh checkout, so anything
  # needing a live backend (a listing to click, a password-reset round
  # trip) skips rather than fails.
  #
  # Setting the two PUBLIC_SUPABASE_* repository variables below adds the
  # edge-function auth guards and subscription pricing checks, taking it to
  # 13. That tier still needs no login and creates no rows, so it is safe
  # against the production project and works on pull requests from forks,
  # which cannot read secrets at all.
  #
  # The optional secrets below turn on the rest. Think before setting them:
  # those tests sign in as real fixture accounts, and the deletion spec
  # creates and destroys real auth users. Against the production project
  # that means every push mutates production data. Only wire them up once
  # there is a disposable Supabase project for CI to use:
  #   E2E_SUPABASE_URL / E2E_SUPABASE_ANON_KEY  -- override the target project
  #   E2E_TENANT_EMAIL / E2E_TENANT_PASSWORD    -- fixture logins
  #   E2E_OWNER_EMAIL / E2E_OWNER_PASSWORD
  #   E2E_TEST_LISTING_ID                       -- listing owned by that owner
  #   E2E_SERVICE_ROLE_KEY                      -- bypasses RLS entirely
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Falls back to the public project values so the credential-free
          # tier still has somewhere to send its requests. Without a URL the
          # edge-function calls would resolve relative to the dev server and
          # come back 404, which reads as a failure rather than a skip.
          VITE_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || vars.PUBLIC_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY || vars.PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
          E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_TEST_LISTING_ID: ${{ secrets.E2E_TEST_LISTING_ID }}
          E2E_SERVICE_ROLE_KEY: ${{ secrets.E2E_SERVICE_ROLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Production deploys happen HERE, only after verify and e2e are green -- Vercel's
  # git auto-deploy for main is disabled in vercel.json (git.deploymentEnabled),
  # because it shipped every push regardless of CI outcome. An `ignoreCommand`
  # can't fix that: Vercel starts building the moment a push lands, before CI
  # has produced any check result to consult.
  #
  # Requires three repo secrets (Settings -> Secrets and variables -> Actions):
  #   VERCEL_TOKEN       -- vercel.com -> Account Settings -> Tokens
  #   VERCEL_ORG_ID      -- from .vercel/project.json after `vercel link`,
  #   VERCEL_PROJECT_ID     or Vercel dashboard -> Project -> Settings -> General
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check deploy secrets are configured
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set. Production deploys are paused until they are added (see comments in this workflow file)."
            exit 1
          fi

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
